[project]
name = "anlam-atolyesi"
version = "1.0.0"
description = "Gensim Word2Vec ile Türkçe anlamsal benzerlik uygulaması"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "starlette==1.8.0",
  "pydantic==2.14.1",
  "uvicorn[standard]==0.54.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
